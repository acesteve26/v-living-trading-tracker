<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Users — V Living Trading Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <div class="page">
    <div class="page-header">
      <h1>Users</h1>
      <div class="page-actions">
        <button class="btn secondary hidden" id="btnSystemLog">System Log</button>
        <button class="btn" id="btnAddUser">+ Add User</button>
      </div>
    </div>

    <div class="card">
      <div class="table-scroll">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Seen</th><th>Password</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Company Settings</h3>
      <form id="settingsForm" class="form-grid">
        <div class="field">
          <label>Company / brand name</label>
          <input id="s_company_name" />
        </div>
        <div class="field">
          <label>Reporting currency</label>
          <select id="s_currency">
            <option>AED</option><option>USD</option><option>GBP</option><option>EUR</option><option>SAR</option><option>INR</option>
          </select>
        </div>
        <div class="full modal-actions" style="justify-content:flex-start;">
          <button class="btn" type="submit">Save Settings</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Slides in from the right rather than sitting over the page as a box:
       the log is a long list being scanned, and the table stays visible
       behind it so it is obvious whose activity is being read. -->
  <div class="drawer-backdrop hidden" id="activityDrawer">
    <aside class="drawer" role="dialog" aria-labelledby="activityTitle">
      <div class="drawer-head">
        <div>
          <h2 id="activityTitle">Activity</h2>
          <p class="drawer-sub" id="activitySub"></p>
        </div>
        <button type="button" class="btn secondary small" id="closeActivity">Close</button>
      </div>

      <div class="activity-summary" id="activitySummary"></div>

      <div class="drawer-toolbar">
        <select id="activityDays">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last 12 months</option>
        </select>
        <span class="muted-note" id="activityCount"></span>
      </div>

      <ol class="activity-list drawer-list" id="activityEvents"></ol>
      <p class="muted-note" id="activityFootnote"></p>
    </aside>
  </div>

  <div class="modal-backdrop hidden" id="userModal">
    <div class="modal">
      <h2 id="userModalTitle">Add User</h2>
      <form id="userForm">
        <input type="hidden" id="u_id" />
        <div class="field"><label>Name *</label><input id="u_name" required /></div>
        <div class="field"><label>Email *</label><input type="email" id="u_email" required /></div>
        <div class="field">
          <label id="u_passwordLabel">Temporary password *</label>
          <input type="password" id="u_password" minlength="6" />
          <p class="field-hint" id="u_passwordHint">They'll be asked to set their own password when they first sign in.</p>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="u_role">
            <option value="sales">Sales — works the pipeline</option>
            <option value="management">Management — read-only, full reports</option>
            <option value="accounts">Accounts — read-only, full reports</option>
            <option value="admin">Admin — everything, incl. users</option>
          </select>
        </div>
        <div class="field" id="u_activeWrap">
          <label>Status</label>
          <select id="u_active"><option value="1">Active</option><option value="0">Deactivated</option></select>
        </div>
        <div class="error-text" id="userErr"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelUser">Cancel</button>
          <button type="submit" class="btn" id="userSubmit">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="accountModal">
    <div class="modal">
      <h2>My Account</h2>
      <form id="pwForm">
        <div class="field"><label>Current password</label><input type="password" id="curPw" required /></div>
        <div class="field"><label>New password</label><input type="password" id="newPw" required minlength="6" /></div>
        <div class="error-text" id="pwErr"></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="closeAccount">Close</button>
          <button type="submit" class="btn">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
