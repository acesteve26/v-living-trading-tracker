<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>V Living Trading Tracker — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-lockup">
        <img src="/img/vliving-logo.png" alt="V Living" />
        <span class="sub">Trading</span>
      </div>
      <h1>Trading Tracker</h1>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required autofocus />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>
        <div class="error-text" id="err"></div>
        <button class="btn" style="width:100%; justify-content:center; padding:13px;" type="submit">Log in</button>
      </form>
      <div class="hint-box">
        Trouble signing in? Contact your V Living administrator to have your password reset.
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
